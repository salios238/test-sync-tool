name: Build Wheel

on:
  push:
    branches: [ "main" ]  # mainブランチにプッシュされた時に実行
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest  # クラウド上のLinuxマシンで実行

    steps:
    - uses: actions/checkout@v4  # コードをチェックアウト

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build wheel
      run: python -m build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-sync-wheel  # 成果物の名前
        path: dist/*.whl       # distフォルダの中のwheelファイルを保存